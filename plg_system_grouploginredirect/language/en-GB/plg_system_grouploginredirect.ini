PLG_SYSTEM_GROUPLOGINREDIRECT_NOTE_RULES_LABEL="How Group Redirects Work"
PLG_SYSTEM_GROUPLOGINREDIRECT_NOTE_RULES_DESC="If a user belongs to more than one group listed below, the first matching rule with a destination for the relevant action determines their redirect. Rules are checked from top to bottom, so use the move controls to set the priority. Login and logout destinations are configured independently. If no matching destination is configured, Joomla's normal redirect behaviour is unchanged."
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_RULES_LABEL="Group Redirect Rules"
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_RULES_DESC="Add one or more user group and menu item combinations for login and logout."
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_USERGROUP_LABEL="User Group"
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_USERGROUP_DESC="Select the user group that should use these redirects."
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_MENUITEM_LOGIN_LABEL="Redirect to Menu Item on Login"
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_MENUITEM_LOGIN_DESC="Select the frontend menu item to use after a successful login."
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_MENUITEM_LOGOUT_LABEL="Redirect to Menu Item on Logout"
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_MENUITEM_LOGOUT_DESC="Select the frontend menu item to use after a successful logout. Leave blank to use Joomla's normal logout redirect."
