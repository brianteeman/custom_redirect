PLG_SYSTEM_GROUPLOGINREDIRECT_NOTE_RULES_LABEL="How Group Redirects Work"
PLG_SYSTEM_GROUPLOGINREDIRECT_NOTE_RULES_DESC="If a user belongs to more than one group listed below, the first matching rule determines their redirect. Rules are checked from top to bottom, so use the move controls to set the priority. If no rule matches, Joomla's normal login redirect behaviour is unchanged."
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_RULES_LABEL="Group Redirect Rules"
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_RULES_DESC="Add one or more user group and menu item combinations. Rules are checked from top to bottom; the first matching group is used."
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_USERGROUP_LABEL="User Group"
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_USERGROUP_DESC="Select the user group that should use this redirect."
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_MENUITEM_LABEL="Redirect to Menu Item"
PLG_SYSTEM_GROUPLOGINREDIRECT_FIELD_MENUITEM_DESC="Select the frontend menu item to use as the login destination."
