name: Build and publish plugin release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build installable plugin ZIP
        run: |
          cd plg_system_grouploginredirect
          zip -r "$GITHUB_WORKSPACE/plg_system_grouploginredirect.zip" .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "$GITHUB_WORKSPACE/plg_system_grouploginredirect.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
